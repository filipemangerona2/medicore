name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verificar sintaxe de todos os arquivos
        run: python -m compileall -q app.py medicore tests

      - name: Rodar todos os testes (cálculos, conteúdo, busca e interface)
        run: pytest -q

      - name: Iniciar o servidor Streamlit e conferir que responde
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          for tentativa in $(seq 1 45); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo " — servidor respondeu"
              exit 0
            fi
            sleep 2
          done
          echo "O servidor não respondeu. Log:"
          cat streamlit.log
          exit 1
